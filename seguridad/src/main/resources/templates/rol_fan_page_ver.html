<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Consultar Rol Fan Page</title>
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen p-4">
    <div class="tarjeta-contenedor">
        <div class="cabecera-logo">
        <img th:src="@{/Imágenes/logo.png}" alt="Logo de la red social" class="img-fluid w-25">
        <h1 class="text-lg font-bold">Detalle Rol Fan Page</h1>
    </div>
    <div class="contenido-principal">
        <h2 class="titulo-seccion">Detalle Rol Fan Page</h2>
        
            
            <div class="rejilla-formulario">  
                <div class="campo">
                    <input type="hidden" th:field="*{rolfanpage.cod_rol_fan}"/>
                    <label for="persona" class="etiqueta">Persona: </label>           
                    <input type="text" id="persona" th:value="*{rolfanpage.persona.nm1_per + ' ' + rolfanpage.persona.ap1_per}" class="entrada" required maxlength="100" readonly/>
                    <span class="error-message"></span>
                </div>


                <div class="campo">
                    <label for="fan_page" class="etiqueta">Fan Page: </label>
                    <input type="text" id="fan_page" class="entrada" th:value="*{rolfanpage.fan_page.nom_fan_pag}" readonly>
                    <span class="error-message"></span>
                </div>

                <div class="campo">
                    <label for="rol" class="etiqueta">Rol: </label>
                    <input type="text" id="rol" class="entrada" th:value="*{rolfanpage.rol.nom_rol}" readonly>
                    <span class="error-message"></span>
                </div>

                <div class="campo">
                    <label for="est_rol_fan" class="etiqueta">Estatus</label>
                    <select id="est_rol_fan" th:field="*{rolfanpage.est_rol_fan}" class="entrada" disable>
                        <option value=""></option>
                        <option value="A">Activo</option>
                        <option value="I">Inactivo</option>
                    </select>
                    <span class="error-message"></span>
                </div>
        </div>

            <div class="contenedor-botones">
                <a th:href='@{/rol_fan_page_listar}' class="boton-secundario">Cerrar</a>
            </div>

            </div> 
        </form>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>  
</body>
</html>
