<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
    <title>Listar Usuario</title>
</head>
<body>
    <div class="contenedor-tarjeta">
        <div class="cabecera-logo">
            <img th:src="@{/Imágenes/logo.png}" alt="Logo de la red social" class="img-fluid w-25">
        </div>
        <div class="contenido-principal">
            <div class="titulo-solicitud">Usuarios</div>

            <div class="contenedor-tabla">
                <table class="tabla-centrada">
                    <thead>
                        <tr>
                            <th>Código</th>
                            <th>Alias</th>
                            <th>Email</th>
                            <th>Clave</th>
                            <th>Estatus</th>
                            <th>Acción</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Si no hay usuarios, muestra este mensaje -->
                        <tr th:if="${#lists.isEmpty(usuarios)}">
                            <td colspan="6" class="text-center">No hay usuarios registrados.</td>
                        </tr>

                        <!-- Una fila por cada usuario -->
                        <tr th:each="usuario : ${usuarios}">
                            <td class="text-center" th:text="${usuario.getCod_usu()}"></td>
                            <td class="text-center" th:text="${usuario.getAli_usu()}"></td>
                            <td class="text-center" th:text="${usuario.getEma_usu()}"></td>
                            <td class="text-center" th:text="${usuario.getClaUsuMascara()}"></td>
                            <td class="text-center" th:text="${usuario.getEst_usu()}"></td>
                            <td class="text-center acciones-tabla">
                                <a th:href="@{/usuario_ver(cod_usu=${usuario.getCod_usu()})}"
                                   class="boton-accion-tabla"
                                   data-bs-toggle="tooltip" data-bs-placement="top" title="Ver">
                                    <i class="fa-solid fa-eye"></i>
                                </a>
                                <a th:href="@{/usuario_editar(cod_usu=${usuario.getCod_usu()})}"
                                   class="boton-accion-tabla"
                                   data-bs-toggle="tooltip" data-bs-placement="top" title="Editar">
                                    <i class="fa-solid fa-pen-to-square"></i>
                                </a>
                                <a th:href="@{/usuario_eliminar(cod_usu=${usuario.getCod_usu()})}"
                                   class="boton-accion-tabla btn-eliminar-confirmar"
                                   th:data-id="${usuario.getCod_usu()}"
                                   th:data-nombre="${usuario.getAli_usu()}"
                                   data-bs-toggle="tooltip" data-bs-placement="top" title="Eliminar">
                                    <i class="fa-solid fa-trash-can"></i>
                                </a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <div class="rejilla-botones">
                <a class="boton-accion" th:href="@{/usuario_agregar}">Agregar</a>
                <a class="boton-accion" th:href="@{/usuario}">Usuario</a>
                <a class="boton-volver" th:href="@{/seguridad}">Seguridad</a>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script th:inline="javascript">
        document.addEventListener("DOMContentLoaded", function () {

            // Estilo de las ventanas emergentes (rosado y negro)
            const estiloAlerta = {
                background: '#121212',
                color: '#f5f5f5',
                confirmButtonColor: '#ff1493'
            };

            // Mensajes que manda el controlador (éxito o error)
            const exito = /*[[${exito}]]*/ null;
            const error = /*[[${error}]]*/ null;

            if (exito) {
                Swal.fire({
                    ...estiloAlerta,
                    icon: 'success',
                    title: '¡Hecho!',
                    text: exito,
                    timer: 3000
                });
            }

            if (error) {
                Swal.fire({
                    ...estiloAlerta,
                    icon: 'error',
                    title: 'Lo siento',
                    text: error
                });
            }

            // Confirmación antes de eliminar
            document.querySelectorAll('.btn-eliminar-confirmar').forEach(function (boton) {
                boton.addEventListener('click', function (event) {
                    event.preventDefault(); // evita borrar sin preguntar
                    const urlDestino = this.getAttribute('href');
                    const codUsu = this.getAttribute('data-id');
                    const aliUsu = this.getAttribute('data-nombre');

                    Swal.fire({
                        ...estiloAlerta,
                        title: '¿Estás seguro?',
                        text: 'Vas a eliminar el usuario: ' + aliUsu + ' (Código: ' + codUsu + ')',
                        icon: 'warning',
                        showCancelButton: true,
                        cancelButtonColor: '#555555',
                        confirmButtonText: 'Sí, eliminar',
                        cancelButtonText: 'Cancelar'
                    }).then(function (result) {
                        if (result.isConfirmed) {
                            window.location.href = urlDestino;
                        }
                    });
                });
            });

            // Activar los tooltips de Bootstrap (Ver / Editar / Eliminar)
            document.querySelectorAll('[data-bs-toggle="tooltip"]').forEach(function (el) {
                new bootstrap.Tooltip(el);
            });
        });
    </script>
</body>
</html>
