<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Agregar Rol</title>
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen p-4">
    <div class="tarjeta-contenedor">
        <div class="cabecera-logo">
        <img th:src="@{/Imágenes/logo.png}" alt="Logo de la red social" class="img-fluid w-25">
        <h1 class="text-lg font-bold">Registro Rol</h1>
    </div>
    <div class="contenido-principal">
        <h2 class="titulo-seccion">Agregar Nuevo Rol</h2>
        
        <form th:action="@{/rol_agregar}" th:object="${rol}" class="formulario" method="post">
            <div style="max-width: 600px; width: 100%; margin: 0 auto;">
            
            <div class="rejilla-formulario col-2">  
                <div class="campo">
                    <label for="nom_rol" class="etiqueta">Nombre Del Rol</label>           
                    <input type="text" id="nom_rol" name="nom_rol" th:field="*{nom_rol}" class="entrada" required maxlength="100"/>
                    <span class="error-message"></span>
                </div>

                <div class="campo"> 
                    <label for="des_rol" class="etiqueta">Descripcion del Rol</label>
                    <textarea id="des_rol" name="des_rol" th:field="*{des_rol}" class="entrada" maxlength="1000" rows="3"></textarea>
                    <span class="error-message"></span>
                </div>

                <div class="campo">
                    <label for="est_rol" class="etiqueta">Estatus</label>
                    <select id="est_rol" name="est_rol"  th:field="*{est_rol}" class="entrada" required>
                        <option value=""></option>
                        <option value="A">Activo</option>
                        <option value="I">Inactivo</option>
                    </select>
                    <span class="error-message"></span>
                </div>
        </div>

            <div class="contenedor-botones">
                <button type="submit" class="boton-accion">Guardar</button>
                <button type="reset" class="boton-accion">Limpiar</button>
                <a th:href='@{/rol}' class="boton-secundario">Volver</a>
            </div>

            </div> 
        </form>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>  
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script th:inline="javascript">
        const mensaje = '[[${mensaje}]]';
        if (mensaje === "exito") {
            Swal.fire({ title: "¡Logrado!", text: "El rol se ha registrado correctamente.", icon: "success", confirmButtonColor: "#3085d6" });
        } else if (mensaje === "error") {
            Swal.fire({ title: "Error", text: "No se pudo realizar la inserción. Inténtalo de nuevo.", icon: "error", confirmButtonColor: "#d33" });
        }
    </script>
</body>
</html>
