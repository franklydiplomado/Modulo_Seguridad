<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Agregar Rol Fan Page</title>
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen p-4">
    <div class="tarjeta-contenedor">
        <div class="cabecera-logo">
        <img th:src="@{/Imágenes/logo.png}" alt="Logo de la red social" class="img-fluid w-25">
        <h1 class="text-lg font-bold">Registro Rol Fan Page</h1>
    </div>
    <div class="contenido-principal">
        <h2 class="titulo-seccion">Agregar Nuevo Rol Fan Page</h2>
        
        <form th:action="@{/rol_fan_page_agregar}" th:object="${rolfanpage}" class="formulario" method="post">
            <div style="max-width: 600px; width: 100%; margin: 0 auto;">
            
            <div class="rejilla-formulario col-2">  
                <div class="campo">
                    <label class="etiqueta" for="persona">Usuario:</label>
                    <select id="persona" name="persona" th:field="*{persona}" class="entrada" required>
                        <option value="">Seleccione...</option>
                        //Los select se van a ir llenando con todas las personas que esten en la BD, para eso se utiliza un ciclo parecido a un for. Recorre uno por uno los elementos de la lista llamada ${personas} que el controlador preparo con el metodo persona.listarPersonas().
                        //En cada vuelta del ciclo, el elemento actual se guarda temporalmente en la variable persona. es decir agarra
                        cada persona una por una
                        //En el value se coloca es el codigo de la persona
                        //Y en el texto si se muestra la concatenacion del nombre y el apellido separada con espacios
                        <option
                        th:each="persona : ${personas}"
                        th:value="${persona.cod_per}"
                        th:text="${persona.nm1_per + ' ' + persona.ap1_per}">
                    </option>
                </select>
                </div>

                <div class="campo"> 
                    <label for="fan_page" class="etiqueta">Fan Page:</label>
                    <select id="fan_page" name="fan_page" th:field="*{fan_page}" class="entrada" maxlength="1000" rows="3" required>
                    <option value="">Seleccione...</option>
                    <option th:each="fanpage : ${fanpages}"
                            th:value="${fanpage.cod_fan_pag}"
                            th:text="${fanpage.nom_fan_pag}"></option>
                    </select>
                </div>
                <div class="campo">
                    <label for="rol" class="etiqueta">Rol:</label>
                    <select id="rol"  name="rol"th:field="*{rol}" class="entrada" required>
                    <option value="">Seleccione...</option>
                    <option th:each="rol : ${roles}"
                            th:value="${rol.cod_rol}"
                            th:text="${rol.nom_rol}"></option>
                    </select>
                </div>
                    <div class="campo">
                    <label for="est_rol_fan" class="etiqueta">Estatus:</label>
                    <select id="est_rol_fan"  name="est_rol_fan" th:field="*{est_rol_fan}" class="entrada" required>
                    <option value="">Seleccione...</option>
                    <option value="A">Activo</option>
                    <option value="I">Inactivo</option>
                    </select>
                </div>
        </div>

            <div class="contenedor-botones">
                <button type="submit" class="boton-accion">Guardar</button>
                <button type="reset" class="boton-accion">Limpiar</button>
                <a th:href='@{/rol_fan_page}' class="boton-secundario">Volver</a>
            </div>

            </div> 
        </form>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>  
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script th:inline="javascript">
        const mensaje = '[[${mensaje}]]';
        if (mensaje === "exito") {
            Swal.fire({ title: "¡Logrado!", text: "El rol se ha registrado correctamente.", icon: "success", confirmButtonColor: "#3085d6" });
        } else if (mensaje === "error") {
            Swal.fire({ title: "Error", text: "No se pudo realizar la inserción. Inténtalo de nuevo.", icon: "error", confirmButtonColor: "#d33" });
        }
    </script>
</body>
</html>
