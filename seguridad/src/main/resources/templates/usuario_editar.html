<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Usuario</title>
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>
    <div class="tarjeta-contenedor">
        <div class="cabecera-logo">
            <img th:src="@{/Imágenes/logo.png}" alt="Logo de la red social" class="img-fluid w-25">
            <h1>Editar Usuario</h1>
        </div>
        <div class="contenido-principal">
            <h2 class="titulo-seccion">Editar Usuario</h2>
            <form th:action="@{/usuario_editar}" th:object="${usuario}" class="formulario" method="post">
                <div style="max-width: 600px; width: 100%; margin: 0 auto;">
                    <div class="rejilla-formulario">
                        <div class="campo">
                            <input type="hidden" th:field="*{cod_usu}" />
                            <label for="ali_usu" class="etiqueta">Alias Del Usuario</label>
                            <input type="text" id="ali_usu" th:field="*{ali_usu}" class="entrada" required maxlength="100" />
                        </div>
                        <div class="campo">
                            <label for="ema_usu" class="etiqueta">Email Del Usuario</label>
                            <input type="text" id="ema_usu" th:field="*{ema_usu}" class="entrada" required maxlength="100" />
                        </div>
                        <div class="campo">
                            <label for="cla_usu" class="etiqueta">Nueva clave (déjala vacía para no cambiarla)</label>
                            <input type="password" id="cla_usu" name="cla_usu" class="entrada" maxlength="100" autocomplete="new-password" />
                        </div>
                        <div class="campo">
                            <label for="est_usu" class="etiqueta">Estatus</label>
                            <select id="est_usu" th:field="*{est_usu}" class="entrada" required>
                                <option value=""></option>
                                <option value="A">Activo</option>
                                <option value="I">Inactivo</option>
                            </select>
                        </div>
                    </div>
                    <div class="contenedor-botones">
                        <button type="submit" class="boton-accion">Editar</button>
                        <a th:href="@{/usuario_listar}" class="boton-secundario">Volver</a>
                    </div>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
