<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
    <title>Listar Rol Fan Page</title>
</head>
<body>
    <div class="contenedor-tarjeta">
        <div class="cabecera-logo">
            <img th:src="@{/Imágenes/logo.png}" alt="Logo de la red social" class="img-fluid w-25">
        </div>

        <div class="contenido-principal">
            <div class="titulo-solicitud">Rol Fan Pages</div>

            <div class="contenedor-tabla">
                <table class="tabla-centrada">
                    <thead>
                        <tr>
                            <th>Código</th>
                            <th>Nombre</th>
                            <th>Apellido</th>
                            <th>Fan Page</th>
                            <th>Rol</th>
                            <th>Estatus</th>
                            <th>Acción</th>
                        </tr>
                    </thead>
                    <tbody>
                            <tr th:if="${#lists.isEmpty(rolfanpages)}">
                            <td colspan="6" class="text-center">No hay roles registrados</td>
                        </tr>

                        <tr th:each="rolfanpage : ${rolfanpages}">
                            <td class="text-center" th:text="${rolfanpage.getCod_rol_fan()}"></td>
                            <td class="text-center" th:text="${rolfanpage.persona.getNm1_per()}"></td>
                            <td class="text-center" th:text="${rolfanpage.persona.getAp1_per()}"></td>
                            <td class="text-center" th:text="${rolfanpage.fan_page.getNom_fan_pag()}"></td>
                            <td class="text-center" th:text="${rolfanpage.rol.getNom_rol()}"></td>
                            <td class="text-center" th:text="${rolfanpage.getEst_rol_fan()}"></td>
                            <td class="text-center acciones-tabel">
                                <a th:href="@{/rol_fan_page_ver(cod_rol_fan=${rolfanpage.getCod_rol_fan()})}" class="boton-action-table" data-bs-toggle="tooltip" data-bs-placement="top" title="Ver"><i class="fa-solid fa-eye"></i></a>
                                <a th:href="@{/rol_fan_page_editar(cod_rol_fan=${rolfanpage.getCod_rol_fan()})}" class="boton-action-table" data-bs-toggle="tooltip" data-bs-placement="top" title="Editar"><i class="fa-solid fa-pen-to-square"></i></a>
                                <a th:href="@{/rol_fan_page_eliminar(cod_rol_fan=${rolfanpage.getCod_rol_fan()})}" class="boton-action-table btn-eliminar-confirmar" th:data-id="${rolfanpage.getCod_rol_fan()}" data-bs-toggle="tooltip" data-bs-placement="top" title="Eliminar"><i class="fa-solid fa-trash-can"></i></a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <div class="rejilla-botones">
                <a class="boton-accion" th:href="@{/rol_fan_page_agregar}">Agregar</a>
                <a class="boton-accion" th:href="@{/rol_fan_page}">Rol</a>
                <a class="boton-volver" th:href="@{/seguridad}">Seguridad</a>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script th:inline="javascript">
        document.addEventListener("DOMContentLoaded", function() {
            /*[# th:if="${exito}"]*/            
            Swal.fire({
                icon: 'success',
                title: '¡Hecho!',
                text: '[[${exito}]]', 
                confirmButtonColor: 'rgba(172, 11, 236, 1)',
                timer: 3000
            });
            /*[/]*/

            /*[# th:if="${error}"]*/
                Swal.fire({
                    icon: 'error',
                    title: 'Lo siento',
                    text: '[[${error}]]', 
                    confirmButtonColor: 'rgba(172, 11, 236, 1)'
                });
            /*[/]*/

            // Manejo de eliminación con SweetAlert2 adaptado al contexto de la tabla
            const botonesEliminar = document.querySelectorAll('.btn-eliminar-confirmar');
            botonesEliminar.forEach(boton => {
                boton.addEventListener('click', function(event) {
                    event.preventDefault(); 
                    
                    const urlDestino = this.getAttribute('href'); 
                    const codRolFan = this.getAttribute('data-id');

                    Swal.fire({
                        title: '¿Estás seguro?',
                        text: `Vas a eliminar el rol fan page con codigo: ${codRolFan}`,
                        icon: 'warning',
                        showCancelButton: true,
                        confirmButtonColor: 'rgba(172, 11, 236, 1)',
                        cancelButtonColor: '#f122d2',
                        confirmButtonText: 'Sí, eliminar',
                        cancelButtonText: 'Cancelar'
                    }).then((result) => {
                        if (result.isConfirmed){                          
                            window.location.href = urlDestino;
                        }
                    });
                });
            });
        });
    </script>
    <script>
        const tooltipTriggerList = document.querySelectorAll('[data-bs-toggle="tooltip"]'); 
        const tooltipList = [...tooltipTriggerList].map(tooltipEl => new bootstrap.Tooltip(tooltipEl));
    </script>
</body>
</html>
